[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcode-viewer"
version = "0.2.0"
description = "3D G-code toolpath viewer with interactive GUI and CLI export"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "hyiger" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "gcode-lib>=1.1.0",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "numpy>=1.24",
    "PyQt6>=6.5",
]

[project.urls]
Homepage = "https://github.com/hyiger/gcode-viewer"
Repository = "https://github.com/hyiger/gcode-viewer"
Issues = "https://github.com/hyiger/gcode-viewer/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
gcode-viewer = "gcode_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcode_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real gcode files"]
