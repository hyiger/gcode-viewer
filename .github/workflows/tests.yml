name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      DISPLAY: ":99.0"
      PYVISTA_OFF_SCREEN: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxrender1

      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1024x768x24 &

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install git+https://github.com/hyiger/gcode-lib.git
          uv pip install -e ".[dev]"

      - name: Run unit tests
        run: uv run pytest -m "not integration" --cov=gcode_viewer --cov-report=term-missing -v
